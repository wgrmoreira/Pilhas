<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilhas - Hexa Sort</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
        
        * { box-sizing: border-box; user-select: none; }
        body { 
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #1e1e2f, #2a2a40); 
            font-family: 'Poppins', sans-serif; 
            overflow: hidden; touch-action: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; color: white;
        }
        
        .screen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.5s;
        }

        .logo-art { position: relative; width: 160px; height: 160px; margin-bottom: 40px; }
        .hex-part {
            position: absolute; width: 80px; height: 92px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .hex-part:nth-child(1) { top: 0; left: 40px; background: #ff4d4d; z-index: 3; }
        .hex-part:nth-child(2) { top: 60px; left: 0; background: #ffd633; z-index: 2; }
        .hex-part:nth-child(3) { top: 60px; left: 80px; background: #4da6ff; z-index: 1; }

        h1.title { font-size: 48px; margin: 0 0 10px 0; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        button {
            padding: 15px 40px; font-size: 20px; font-weight: 800; font-family: 'Poppins';
            background: linear-gradient(to bottom, #47d147, #33cc33); color: white; border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 6px 0 #248f24, 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s; margin-top: 20px;
        }
        button:active { transform: translateY(6px); box-shadow: 0 0px 0 #248f24, 0 5px 10px rgba(0,0,0,0.4); }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; flex-direction: column; justify-content: space-between; z-index: 10;
        }
        .header { display: flex; justify-content: space-between; padding: 20px; width: 100%; max-width: 600px; margin: 0 auto; }
        .score-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .score-box span { display: block; font-size: 24px; font-weight: 800; color: #ffeb3b; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <div id="startScreen" class="screen-overlay">
        <div class="logo-art"><div class="hex-part"></div><div class="hex-part"></div><div class="hex-part"></div></div>
        <h1 class="title">Pilhas</h1>
        <p>Combine cores, limpe o tabuleiro!</p>
        <button onclick="startGame()">JOGAR</button>
    </div>

    <div id="ui-layer">
        <div class="header">
            <div class="score-box">Pontos <span id="scoreText">0</span></div>
            <div class="score-box">Recorde <span id="highScoreText">0</span></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameOver" class="screen-overlay" style="display: none; background: rgba(30,30,47,0.95);">
        <h1 style="color: #ff4d4d; font-size: 40px; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Sem Espaços!</h1>
        <p style="font-size: 20px;">Você fez <b id="finalScore" style="color: #ffeb3b; font-size: 32px;">0</b> pontos.</p>
        <button onclick="resetGame()">Tentar Novamente</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'grab') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'fly') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'clear') {
                [440, 554, 659].forEach(freq => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'square'; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    o.start(now); o.stop(now + 0.5);
                });
            }
        }

        let score = 0;
        let highScore = localStorage.getItem('pilhasHighScore') || 0;
        document.getElementById('highScoreText').innerText = highScore;

        // Adicionada a propriedade "light" para fazer o brilho do gradiente
        const TYPES = [
            { id: 0, color: '#ff4d4d', dark: '#b30000', light: '#ff8080', img: '🍎' },
            { id: 1, color: '#ffd633', dark: '#b38f00', light: '#ffe680', img: '🍌' },
            { id: 2, color: '#b366ff', dark: '#6600cc', light: '#cc99ff', img: '🍇' },
            { id: 3, color: '#4da6ff', dark: '#0059b3', light: '#80c1ff', img: '🧊' },
            { id: 4, color: '#33cc33', dark: '#1e7b1e', light: '#70db70', img: '🥝' }
        ];
        const MOTIVATIONS = ['Ótimo!', 'Excelente!', 'Incrível!', 'Brilhante!', 'Fantástico!', 'Genial!', 'Perfeito!', 'Espetacular!', 'Magnífico!', 'Supremo!'];

        let HEX_SIZE = 36; let SCALE_Y = 0.65; let THICKNESS = 8;
        let board = new Map(); let deck = []; let dragging = null; let mouse = { x: 0, y: 0 };
        let animations = []; let floaters = []; let isAnimating = false;
        let boardOffsetX, boardOffsetY;

        function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            boardOffsetX = canvas.width / 2; boardOffsetY = canvas.height * 0.45;
            HEX_SIZE = Math.min(canvas.width / 12, 42); // Peças ligeiramente maiores
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function startGame() {
            initAudio(); playSound('click');
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            resetGame();
        }

        function initBoard() {
            board.clear();
            const radius = 2; let keys = [];
            for (let q = -radius; q <= radius; q++) {
                let r1 = Math.max(-radius, -q - radius); let r2 = Math.min(radius, -q + radius);
                for (let r = r1; r <= r2; r++) { board.set(`${q},${r}`, []); keys.push(`${q},${r}`); }
            }
            for(let i=0; i<3; i++) {
                let randomKey = keys[Math.floor(Math.random() * keys.length)];
                board.set(randomKey, generateStack());
                keys = keys.filter(k => k !== randomKey);
            }
        }

        function generateStack() {
            let stackSize = Math.floor(Math.random() * 3) + 2; let stack = [];
            for (let j = 0; j < stackSize; j++) stack.push(TYPES[Math.floor(Math.random() * TYPES.length)].id);
            return stack;
        }

        function fillDeck() {
            deck = [];
            let spacing = Math.min(canvas.width / 3.5, 120);
            let startX = canvas.width / 2 - spacing; let deckY = canvas.height * 0.85;
            for (let i = 0; i < 3; i++) deck.push({ x: startX + (i * spacing), y: deckY, stack: generateStack() });
        }

        function hexToPixel(q, r) { return { x: HEX_SIZE * Math.sqrt(3) * (q + r / 2) + boardOffsetX, y: HEX_SIZE * 3/2 * r + boardOffsetY }; }
        
        function pixelToHex(x, y) {
            let px = x - boardOffsetX; let py = (y - boardOffsetY) / SCALE_Y;
            let q = (Math.sqrt(3)/3 * px - 1/3 * py) / HEX_SIZE; let r = (2/3 * py) / HEX_SIZE;
            let s = -q - r; let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
            let qDiff = Math.abs(rq - q), rDiff = Math.abs(rr - r), sDiff = Math.abs(rs - s);
            if (qDiff > rDiff && qDiff > sDiff) rq = -rr - rs; else if (rDiff > sDiff) rr = -rq - rs;
            return { q: rq, r: rr };
        }

        // NOVA FUNÇÃO: Desenha Hexágono com cantos arredondados
        function drawRoundedHexShape(ctx, x, y, size, radius) {
            const points = [];
            for (let i = 0; i < 6; i++) {
                let angle = Math.PI / 180 * (60 * i - 30);
                points.push({ x: x + size * Math.cos(angle), y: y + size * Math.sin(angle) });
            }
            
            ctx.beginPath();
            ctx.moveTo(points[0].x + (points[1].x - points[0].x) * 0.5, points[0].y + (points[1].y - points[0].y) * 0.5);
            for (let i = 1; i <= 6; i++) {
                let p1 = points[i % 6];
                let p2 = points[(i + 1) % 6];
                ctx.arcTo(p1.x, p1.y, p2.x, p2.y, radius);
            }
            ctx.closePath();
        }

        function drawHex(x, y, stack, isHover = false) {
            ctx.save(); ctx.translate(x, y); ctx.scale(1, SCALE_Y);
            
            const cornerRadius = HEX_SIZE * 0.15; // 15% do tamanho = cantos arredondados e bonitos

            // Base do Tabuleiro
            drawRoundedHexShape(ctx, 0, 0, HEX_SIZE, cornerRadius);
            ctx.fillStyle = isHover ? 'rgba(255, 255, 255, 0.2)' : 'rgba(0, 0, 0, 0.25)'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.stroke();

            for (let i = 0; i < stack.length; i++) {
                let offsetY = - (i * THICKNESS); let type = TYPES[stack[i]];

                // Lado 3D (Espessura) com sombra suave
                drawRoundedHexShape(ctx, 0, offsetY + (THICKNESS/2), HEX_SIZE, cornerRadius);
                let gradSide = ctx.createLinearGradient(0, offsetY, 0, offsetY + THICKNESS + 5);
                gradSide.addColorStop(0, type.color);
                gradSide.addColorStop(1, type.dark);
                ctx.fillStyle = gradSide; 
                ctx.fill();

                // Topo da peça com luz simulada
                drawRoundedHexShape(ctx, 0, offsetY, HEX_SIZE, cornerRadius);
                let gradTop = ctx.createLinearGradient(0, -HEX_SIZE, 0, HEX_SIZE);
                gradTop.addColorStop(0, type.light);
                gradTop.addColorStop(1, type.color);
                ctx.fillStyle = gradTop; 
                ctx.fill();

                // Brilho Specular (borda interna de plástico)
                ctx.lineWidth = 1.5; 
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; 
                ctx.stroke();

                // Sombra sutil para contornar a peça
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                ctx.stroke();

                if (i === stack.length - 1) {
                    ctx.save(); ctx.translate(0, offsetY); ctx.scale(1, 1/SCALE_Y); 
                    
                    // Sombrinha no Emoji
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetY = 2;
                    
                    ctx.fillStyle = '#fff'; ctx.font = `${HEX_SIZE * 0.55}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(type.img, 0, 2); ctx.restore();
                }
            }
            ctx.restore();
        }

        function updateScore(points) {
            score += points; document.getElementById('scoreText').innerText = score;
            if (score > highScore) { highScore = score; localStorage.setItem('pilhasHighScore', highScore); document.getElementById('highScoreText').innerText = highScore; }
        }

        function spawnFloater(x, y) {
            let text = MOTIVATIONS[Math.floor(Math.random() * MOTIVATIONS.length)];
            floaters.push({ x: x, y: y, text: text, alpha: 1, life: 90 });
        }

        function getColorCount(stack, color) {
            let count = 0;
            for (let i = stack.length - 1; i >= 0; i--) { if (stack[i] === color) count++; else break; }
            return count;
        }

        function findNextCluster() {
            let visited = new Set();
            for (let [key, stack] of board.entries()) {
                if (visited.has(key) || stack.length === 0) continue;
                
                let topColor = stack[stack.length - 1];
                let cluster = [key]; let queue = [key];
                visited.add(key);

                while (queue.length > 0) {
                    let currKey = queue.shift();
                    let [q, r] = currKey.split(',').map(Number);
                    let neighbors = [ {q: q+1, r: r}, {q: q+1, r: r-1}, {q: q, r: r-1}, {q: q-1, r: r}, {q: q-1, r: r+1}, {q: q, r: r+1} ];
                    
                    for (let n of neighbors) {
                        let nKey = `${n.q},${n.r}`;
                        if (board.has(nKey) && !visited.has(nKey)) {
                            let nStack = board.get(nKey);
                            if (nStack.length > 0 && nStack[nStack.length - 1] === topColor) {
                                visited.add(nKey); cluster.push(nKey); queue.push(nKey);
                            }
                        }
                    }
                }
                if (cluster.length > 1) return { color: topColor, nodes: cluster };
            }
            return null;
        }

        function checkBoardState() {
            if (isAnimating) return;

            let clearedSomething = false;
            for (let [key, stack] of board.entries()) {
                if (stack.length === 0) continue;
                let topColor = stack[stack.length - 1];
                let colorCount = getColorCount(stack, topColor);
                
                if (colorCount >= 7) {
                    for(let i=0; i<7; i++) stack.pop(); 
                    let pos = hexToPixel(...key.split(',').map(Number));
                    playSound('clear'); spawnFloater(pos.x, pos.y); updateScore(100);
                    clearedSomething = true;
                }
            }

            if (clearedSomething) {
                setTimeout(checkBoardState, 50); 
                return;
            }

            let clusterData = findNextCluster();
            if (clusterData) {
                processCluster(clusterData);
            } else {
                checkGameOver();
            }
        }

        function processCluster(clusterData) {
            let { color, nodes } = clusterData;
            
            let targetKey = nodes[0]; let maxCount = -1;
            for (let key of nodes) {
                let count = getColorCount(board.get(key), color);
                if (count > maxCount) { maxCount = count; targetKey = key; }
            }

            let targetStack = board.get(targetKey);
            let targetPos = hexToPixel(...targetKey.split(',').map(Number));
            let didMove = false;

            for (let key of nodes) {
                if (key === targetKey) continue;
                let sourceStack = board.get(key);
                let sourcePos = hexToPixel(...key.split(',').map(Number));
                let piecesToMove = [];
                
                while (sourceStack.length > 0 && sourceStack[sourceStack.length - 1] === color) {
                    piecesToMove.push(sourceStack.pop());
                }

                if (piecesToMove.length > 0) {
                    didMove = true; isAnimating = true;
                    piecesToMove.forEach((piece, index) => {
                        let oldHeight = sourceStack.length + piecesToMove.length - 1 - index;
                        animations.push({
                            piece: piece,
                            startX: sourcePos.x, startY: sourcePos.y - (oldHeight * THICKNESS * SCALE_Y),
                            endX: targetPos.x, endY: targetPos.y - ((targetStack.length + index) * THICKNESS * SCALE_Y),
                            progress: 0 - (index * 0.12), targetStack: targetStack
                        });
                    });
                }
            }
            if (didMove) playSound('fly');
        }

        function updateAnimations() {
            if (animations.length === 0) return;
            let allDone = true;
            for (let i = 0; i < animations.length; i++) {
                let anim = animations[i];
                if (anim.progress < 1) { anim.progress += 0.08; allDone = false; }
                if (anim.progress >= 1 && !anim.completed) {
                    anim.targetStack.push(anim.piece); updateScore(10); anim.completed = true;
                }
            }
            if (allDone) { 
                animations = []; isAnimating = false; 
                setTimeout(checkBoardState, 50); 
            }
        }

        function checkGameOver() {
            let emptyCount = 0;
            for (let stack of board.values()) {
                if (stack.length === 0) emptyCount++;
            }
            if (emptyCount === 0 && animations.length === 0) {
                document.getElementById('gameOver').style.display = 'flex';
                document.getElementById('finalScore').innerText = score;
            }
        }

        function resetGame() {
            score = 0; document.getElementById('scoreText').innerText = score;
            document.getElementById('gameOver').style.display = 'none';
            initBoard(); fillDeck();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let sortedKeys = Array.from(board.keys()).sort((a, b) => Number(a.split(',')[1]) - Number(b.split(',')[1]));
            let hexMouse = dragging !== null ? pixelToHex(mouse.x, mouse.y) : null;
            let hoverKey = hexMouse ? `${hexMouse.q},${hexMouse.r}` : null;

            for (let key of sortedKeys) {
                let [q, r] = key.split(',').map(Number);
                drawHex(hexToPixel(q, r).x, hexToPixel(q, r).y, board.get(key), (key === hoverKey && board.get(key).length === 0));
            }

            deck.forEach((item, index) => { if (dragging !== index) drawHex(item.x, item.y, item.stack); });
            if (dragging !== null) drawHex(mouse.x, mouse.y, deck[dragging].stack);

            animations.forEach(anim => {
                if (anim.progress > 0) {
                    let arcY = Math.sin(anim.progress * Math.PI) * 45;
                    drawHex(anim.startX + (anim.endX - anim.startX) * anim.progress, anim.startY + (anim.endY - anim.startY) * anim.progress - arcY, [anim.piece]);
                }
            });

            for (let i = floaters.length - 1; i >= 0; i--) {
                let f = floaters[i]; f.y -= 1; f.alpha -= 0.01; f.life--;
                ctx.save(); ctx.fillStyle = `rgba(255, 235, 59, ${f.alpha})`;
                ctx.font = 'bold 30px Poppins'; ctx.textAlign = 'center'; ctx.shadowColor = 'black'; ctx.shadowBlur = 10;
                ctx.fillText(f.text, f.x, f.y); ctx.restore();
                if (f.life <= 0) floaters.splice(i, 1);
            }

            updateAnimations();
            requestAnimationFrame(draw);
        }

        function handleInputStart(e) {
            if (isAnimating) return;
            let x = e.clientX || (e.touches && e.touches[0].clientX);
            let y = e.clientY || (e.touches && e.touches[0].clientY);
            mouse.x = x; mouse.y = y;
            deck.forEach((item, index) => {
                if (Math.abs(x - item.x) < HEX_SIZE && Math.abs(y - item.y) < HEX_SIZE) { dragging = index; playSound('grab'); }
            });
        }
        function handleInputMove(e) {
            if (dragging === null) return;
            mouse.x = e.clientX || (e.touches && e.touches[0].clientX);
            mouse.y = e.clientY || (e.touches && e.touches[0].clientY);
        }
        function handleInputEnd() {
            if (dragging !== null) {
                let hex = pixelToHex(mouse.x, mouse.y); let key = `${hex.q},${hex.r}`;
                if (board.has(key) && board.get(key).length === 0) {
                    playSound('click'); 
                    board.set(key, deck[dragging].stack); 
                    deck.splice(dragging, 1);
                    
                    if (deck.length === 0) fillDeck();
                    
                    checkBoardState();
                }
                dragging = null;
            }
        }

        canvas.addEventListener('pointerdown', handleInputStart);
        canvas.addEventListener('pointermove', handleInputMove);
        window.addEventListener('pointerup', handleInputEnd);
        requestAnimationFrame(draw);
    </script>
</body>
</html>
